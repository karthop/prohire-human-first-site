<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knight Commercial — Search Status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Knight Commercial brand, sampled from their logo */
  --navy:#1D2655;
  --at-target:#1D2655;
  --chip:#EDF0F5;
  --title:#1D2655;
  --age-warn:#B77A06;
  --age-mid:#C4560E;
  --age-late:#C0392B;
  --navy-2:#2A3468;
  --blue:#3068B2;
  --blue-bg:#E4EDF7;
  --green:#1C7A50;
  --green-bg:#E2F3E9;
  --gray:#CECECF;
  --ink:#222222;

  --slate:#697489;
  --slate-2:#98A1B2;
  --page:#EEF0F4;
  --card:#FFFFFF;
  --rule:#E1E5EC;
  --rule-2:#F0F2F6;
  --amber:#B4771B;
  --amber-bg:#FAF0DD;
  --steel:#6B7A99;
  --steel-bg:#EBEEF4;
  --shadow:0 1px 2px rgba(29,38,85,.06),0 4px 14px rgba(29,38,85,.07);
}
html[data-theme="dark"]{
  --navy:#131A38;
  --at-target:#AFC0E4;
  --chip:#222A4A;
  --title:#E8EBF2;
  --age-warn:#E0A93C;
  --age-mid:#F0894A;
  --age-late:#F0655B;
  --navy-2:#1D2655;
  --blue:#5B93D6;
  --blue-bg:#1C3454;
  --green:#5FCB93;
  --green-bg:#153524;
  --gray:#3A4055;
  --ink:#E8EBF2;

  --slate:#9AA4BA;
  --slate-2:#6E7891;
  --page:#0E1226;
  --card:#171D38;
  --rule:#262D4C;
  --rule-2:#1F2642;
  --amber:#E0A93C;
  --amber-bg:#3A2F16;
  --steel:#8B98B8;
  --steel-bg:#232B47;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.28);
}
html[data-theme="dark"] .top,
html[data-theme="dark"] footer{background:var(--navy-2)}
html[data-theme="dark"] .tag.won{background:var(--blue);color:#0E1226}
html[data-theme="dark"] .slot.won{background:var(--blue)}
.themed{transition:background-color .18s ease,color .18s ease,border-color .18s ease}

.brandline{display:flex;align-items:center;gap:14px;min-width:0}
.kchip{flex:0 0 auto;background:#fff;border-radius:7px;padding:8px 11px;
  display:flex;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.kchip img{display:block;height:30px;width:auto}
.pagelabel{font-size:12px;font-weight:600;letter-spacing:.1em;color:#A9B3CC;white-space:nowrap}
.pmark{flex:0 0 auto;display:block;height:46px;width:auto}
footer .foot-top{display:flex;align-items:center;gap:16px;margin-bottom:12px;flex-wrap:wrap}
footer .foot-top img{display:block;height:76px;width:auto}
@media (max-width:640px){
  .kchip img{height:23px}
  .pmark{height:34px}
  .pagelabel{display:none}
  footer .foot-top img{height:58px}
}
.toggle{
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  font-family:inherit;font-size:11.5px;font-weight:600;color:#C6CFE2;
  background:rgba(255,255,255,.10);border:0;border-radius:100px;padding:5px 11px;
}
.toggle:hover{background:rgba(255,255,255,.17)}
.toggle:focus-visible{outline:2px solid #fff;outline-offset:2px}
.toggle svg{width:13px;height:13px;flex:0 0 auto}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink);
  font-family:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}

.top{background:var(--navy);color:#fff;padding:14px 0}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.who h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.who p{margin:2px 0 0;font-size:12px;color:#A9B3CC;letter-spacing:.09em;font-weight:600}
.pulse{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;
  color:#C6CFE2;background:rgba(255,255,255,.10);border-radius:100px;padding:5px 11px}
.dot{width:6px;height:6px;border-radius:50%;background:#5FD3AE}
.dot.stale{background:#E0A93C}

.strip{background:var(--card);border-bottom:1px solid var(--rule)}
.metrics{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch}
.metric{flex:1 1 0;min-width:116px;padding:12px 16px;border-right:1px solid var(--rule)}
.metric:last-child{border-right:0}
.metric .n{font-size:26px;font-weight:800;line-height:1;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;color:var(--title)}
.metric .l{margin-top:4px;font-size:11.5px;color:var(--slate);line-height:1.25}
.metric.flag .n{color:var(--amber)}
.metric.go .n{color:var(--green)}
.metric.own .n{color:var(--steel)}

.charts{display:grid;grid-template-columns:210px 1fr;gap:14px;padding:16px 0 0}
.panel{background:var(--card);border-radius:9px;box-shadow:var(--shadow);padding:14px 16px 12px}
.panel h3{margin:0 0 2px;font-size:13px;font-weight:700;color:var(--title)}
.panel .cap{margin:0 0 10px;font-size:11px;color:var(--slate);line-height:1.3}
.donut-wrap{display:flex;align-items:center;justify-content:center;position:relative;height:104px}
.donut-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut-mid b{font-size:25px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--title)}
.donut-mid i{font-style:normal;font-size:10.5px;color:var(--slate);margin-top:2px}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:9px;font-size:11px;color:var(--slate)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.key{width:9px;height:9px;border-radius:2px;flex:0 0 auto}

.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;align-items:stretch;padding:14px 0 30px}
.board > *{min-height:300px;margin:0}
.col{background:var(--card);border-radius:9px;box-shadow:var(--shadow);overflow:hidden}
.col-head{padding:13px 15px 11px;border-bottom:1px solid var(--rule);
  border-top:3px solid var(--navy)}
.col-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.col-title h2{margin:0;font-size:15.5px;font-weight:700;letter-spacing:-.012em;line-height:1.2;color:var(--title)}
.slots{flex:0 0 auto;display:flex;gap:3px;align-items:center}
.slot{width:16px;height:6px;border-radius:100px;background:var(--gray)}
.slot.on{background:var(--blue)}
.slot.won{background:var(--navy)}
.col-sub{margin-top:5px;display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--slate)}
.col-sub .short{color:var(--amber);font-weight:700}
.col-sub .full{color:var(--blue);font-weight:700}
.row{display:flex;align-items:center;gap:10px;padding:10px 15px;border-top:1px solid var(--rule-2);
  border-left:3px solid transparent}
.row:first-of-type{border-top:0}
.row.client{border-left-color:var(--amber)}
.row.ours{border-left-color:var(--steel)}
.row.live{border-left-color:var(--green)}
.row.won{border-left-color:var(--navy)}
.row-main{flex:1 1 auto;min-width:0}
.nm{font-size:14.5px;font-weight:700;letter-spacing:-.008em;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{margin-top:2px;font-size:11.5px;color:var(--slate);font-variant-numeric:tabular-nums}
.kchip .cname{font-weight:800;font-size:14px;letter-spacing:-.01em;color:var(--navy);padding:0 4px}
.qual{font-weight:600;color:var(--slate);font-size:.85em}
.count{font-weight:700;font-size:.72em;color:var(--slate);background:var(--chip);border-radius:100px;padding:2px 7px;vertical-align:middle;margin-left:2px}
.moreBtn{display:block;width:100%;background:none;border:0;border-top:1px solid var(--rule);
  color:var(--blue);font:600 12px Archivo,sans-serif;padding:10px 16px;text-align:left;cursor:pointer}
.moreBtn:hover{background:var(--chip)}
.age{font-weight:700}
.age.warn{color:var(--age-warn)}
.age.mid{color:var(--age-mid)}
.age.late{color:var(--age-late)}
.tag{flex:0 0 auto;max-width:44%;font-size:11px;font-weight:700;padding:4px 9px;
  border-radius:100px;line-height:1.3;text-align:center}
.tag.client{background:var(--amber-bg);color:var(--amber)}
.tag.ours{background:var(--steel-bg);color:var(--steel)}
.tag.live{background:var(--green-bg);color:var(--green)}
.tag.won{background:var(--navy);color:#fff}
.empty{padding:11px 15px;font-size:12px;color:var(--slate-2);border-top:1px solid var(--rule-2)}

footer{background:var(--navy);color:#fff;padding:18px 0 24px;font-size:13px}
footer .fn{font-weight:700;font-size:15px}
footer .fl{color:#A9B3CC;margin-top:2px}
footer a{color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.3)}
.stamp{margin-top:11px;font-size:11.5px;color:#7C87A3}
.state{padding:50px 18px;text-align:center;color:var(--slate)}
.state b{display:block;color:var(--title);font-size:17px;margin-bottom:5px}

@media (max-width:820px){.charts{grid-template-columns:1fr;padding-top:14px}}
@media (max-width:520px){
  .metric{min-width:104px;padding:11px 13px}
  .metric .n{font-size:23px}
  .board{grid-template-columns:1fr;gap:12px}
  .who h1{font-size:19px}
}
</style>

function currentClient(){
  const parts=location.pathname.toLowerCase().split("/").filter(Boolean);
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i].replace(/\.html?$/,"");
    if(CLIENTS[p]) return {key:p, ...CLIENTS[p]};
  }
  const q=(new URLSearchParams(location.search).get("client")||"").toLowerCase();
  if(CLIENTS[q]) return {key:q, ...CLIENTS[q]};
  const named = parts.filter(p=>p!=="dashboard" && p!=="portal" && !/\.html?$/.test(p));
  if(named.length===0 && !q){
    const first=Object.keys(CLIENTS)[0];
    return {key:first, ...CLIENTS[first]};
  }
  return null;
}

  const key  = text.toLowerCase().replace(/\s+/g," ");
  const t    = STAGE_TONE[key] || {owner:"prohire",tone:"ours"};
  return {label:text, owner:t.owner, tone:t.tone, counts:t.clock===true,
          rank:(t.rank!==undefined?t.rank:50), clock:t.clock===true};
}

const SNAPSHOT_TAKEN = "Sep 1, 2026 5:10 PM";
const SNAPSHOT = `Client,Position,Submitted As,Hiring Manager,Reports To,First Name,Last Name,Submit Date,Comp,Feedback/ Stage
Knight Commercial,Finance Ops,Direct,Jackie Rios,Bryan Knodel,Jade,Pappous,8/21/2026,"130,000.00",Active Interview
Knight Commercial,Payroll Specialist,Direct,Jackie Rios,Jackie Rios,Kate,Garner,8/24/2026,"80,000.00",Need feedback from client
Knight Commercial,Payroll Specialist,Direct,Jackie Rios,Jackie Rios,Sharon,Klimski,8/21/2026,"65,000.00",Need feedback from client
Knight Commercial,Sales Support Specialist,Direct,Jackie Rios,Grant Parsons,Diana,Oliva,8/31/2026,"75,000.00",Active Interview
Knight Commercial,Finance Ops,Direct,Jackie Rios,Bryan Knodel,Need,Candidates,,,NA
Knight Commercial,Ops Manager,Direct,Jackie Rios,Victor Rrejo,Need,Candidates,,,NA
Knight Commercial,Director of Marketing,Direct,Jackie Rios,Grant Parsons,Mike,Bek,,,Waiting on prescreen
Knight Commercial,Executive Admin Asst,Direct,Jackie Rios,Victor Trejo & Grant Parsons,Marisell,Fournier,,,Waiting on resume
Knight Commercial,Finance Ops,Contract,Jackie Rios,Victor Trejo & Grant Parsons,Clark,Dorsey,8/21/2026,,On Hold`;

function parseCSV(t){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else{ if(c==='"')q=true;
      else if(c===','){row.push(f);f="";}
      else if(c==='\n'){row.push(f);rows.push(row);row=[];f="";}
      else if(c!=='\r')f+=c; }}
  if(f.length||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(v=>v.trim()!==""));
}
function toObjects(rows){
  if(!rows.length)return[];
  const h=rows[0].map(x=>x.trim());
  return rows.slice(1).map(r=>{const o={};h.forEach((k,i)=>{if(ALLOWED.includes(k))o[k]=(r[i]||"").trim();});return o;});
}
const isPh = r => {
  const f=(r["First Name"]||"").trim(), l=(r["Last Name"]||"").trim();
  if(!f && !l) return true;
  /* Hidden statuses: the row still makes its position appear, but no candidate shows */
  const st=(r["Feedback/ Stage"]||"").trim().toLowerCase();
  if(st==="na" || st==="n/a" || st==="need candidates") return true;
  return f.toLowerCase()==="need" && l.toLowerCase()==="candidates";
};
function money(v){
  if(!v||!v.trim())return null;
  const n=Number(String(v).replace(/[^0-9.]/g,""));
  if(!isFinite(n)||n<=0)return null;
  return n<1000 ? "$"+n.toFixed(0)+"/hr" : "$"+Math.round(n/1000)+"k";
}
function daysSince(v){
  if(!v||!v.trim())return null;
  const p=v.split("/");
  if(p.length!==3)return null;
  const d=new Date(+p[2],+p[0]-1,+p[1]);
  if(isNaN(d))return null;
  const t=new Date();
  const n=Math.floor((new Date(t.getFullYear(),t.getMonth(),t.getDate())-d)/86400000);
  return n<0?null:n;
}
function shortDate(v){
  if(!v||!v.trim())return null;
  const p=v.split("/");
  if(p.length===3){const d=new Date(+p[2],+p[0]-1,+p[1]);
    if(!isNaN(d))return d.toLocaleDateString("en-US",{month:"short",day:"numeric"});}
  return v;
}
const esc = s => (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const abbr = s => s.length>15 ? s.slice(0,14).trim()+"\u2026" : s;

function render(recs){
  const want=(CONFIG.clientName||"").trim().toLowerCase();
  if(want && recs.some(r=>(r["Client"]||"").trim()))
    recs=recs.filter(r=>{
      const c=(r["Client"]||"").trim().toLowerCase();
      return !c || c===want || c.startsWith(ACTIVE.key);
    });
  document.title = CONFIG.clientName + " \u2014 Search Status";
  const mark=document.getElementById("clientMark");
  if(mark) mark.innerHTML = ACTIVE.logo
    ? '<img src="'+ACTIVE.logo+'" alt="'+esc(CONFIG.clientName)+'">'
    : '<span class="cname">'+esc(CONFIG.clientName)+'</span>';
  const map=new Map();
  recs.forEach(r=>{
    const p=r["Position"]||"Unspecified";
    if(!map.has(p))map.set(p,{name:p,reportsTo:"",live:[],filled:false,types:[]});
    const b=map.get(p);
    if(r["Reports To"])b.reportsTo=r["Reports To"];
    const rt=(r["Role Type"]||"").trim();
    if(rt)b.types.push(rt);
    if(isPh(r))return;
    const s=stageInfo(r["Feedback/ Stage"]);
    if(s.owner==="closed")b.filled=true;
    b.live.push({rec:r,stage:s});
  });
  map.forEach(b=>{
    b.slate=b.live.filter(c=>c.stage.counts);
    b.roleType = b.types.find(t=>t.toLowerCase()==="direct") || b.types[0] || "";
    b.live.sort((x,y)=>x.stage.rank-y.stage.rank);
  });
  const reqs=[...map.values()].sort((a,b)=>{
    if(a.filled!==b.filled) return a.filled?1:-1;
    return a.slate.length-b.slate.length;
  });

  const all=reqs.flatMap(q=>q.live);
  const withClient=all.filter(c=>c.stage.tone==="client").length;
  const interviewing=all.filter(c=>c.stage.tone==="live").length;
  const withUs=all.filter(c=>c.stage.owner==="prohire"&&c.stage.rank<90).length;

  document.getElementById("metrics").innerHTML=[
    {n:reqs.length,l:"Open searches"},
    {n:all.length,l:"Candidates in process"},
    {n:withClient,l:"Awaiting your feedback",c:"flag"},
    {n:interviewing,l:"In interview",c:"go"},
    {n:withUs,l:"In screening",c:"own"}
  ].map(m=>'<div class="metric '+(m.c||"")+'"><div class="n">'+m.n+'</div><div class="l">'+m.l+'</div></div>').join("");

  const slated=reqs.reduce((a,q)=>a+Math.min(q.slate.length,CONFIG.slateTarget),0);
  const target=reqs.length*CONFIG.slateTarget, filledSlots=Math.min(slated,target);
  const pct=target?filledSlots/target:0;
  const R=42, C=2*Math.PI*R;
  document.getElementById("donut").innerHTML=
    '<g transform="rotate(-90 52 52)">'+
    '<circle cx="52" cy="52" r="'+R+'" fill="none" stroke="var(--gray)" stroke-width="11"/>'+
    '<circle cx="52" cy="52" r="'+R+'" fill="none" stroke="'+(pct>=1?"var(--at-target)":"var(--blue)")+'" '+
      'stroke-width="11" stroke-linecap="round" stroke-dasharray="'+(C*pct).toFixed(1)+' '+C.toFixed(1)+'"/></g>';
  document.getElementById("donutMid").innerHTML='<b>'+Math.round(pct*100)+'%</b><i>'+filledSlots+' of '+target+' slots</i>';
  document.getElementById("donutCap").textContent=
    "Target "+CONFIG.slateTarget+" candidates per search across "+reqs.length+" searches.";

  const W=760,H=150,padL=6,padB=34,padT=24;
  const n=reqs.length||1, slotW=(W-padL*2)/n, barW=Math.min(46,slotW*0.56);
  const maxV=CONFIG.slateTarget;
  const scale=v=>(H-padB-padT)*(v/maxV);
  let svg='';
  const yT=H-padB-scale(CONFIG.slateTarget);
  svg+='<line x1="'+padL+'" y1="'+yT+'" x2="'+(W-padL)+'" y2="'+yT+'" stroke="var(--slate-2)" stroke-width="1" stroke-dasharray="4 4"/>';
  svg+='<text x="'+(W-padL)+'" y="'+(yT-5)+'" text-anchor="end" font-size="10" fill="var(--slate)" font-family="Archivo,sans-serif">target '+CONFIG.slateTarget+'</text>';
  reqs.forEach((q,i)=>{
    const v=q.slate.length, h=Math.max(v?3:0,scale(Math.min(v,CONFIG.slateTarget)));
    const cx=padL+slotW*i+slotW/2, x=cx-barW/2, y=H-padB-h;
    const col=q.filled?"var(--at-target)":(v>=CONFIG.slateTarget?"var(--at-target)":(v===0?"var(--gray)":"var(--blue)"));
    svg+='<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="'+h+'" rx="3" fill="'+col+'"/>';
    svg+='<text x="'+cx+'" y="'+(y-6)+'" text-anchor="middle" font-size="12" font-weight="700" fill="var(--title)" font-family="Archivo,sans-serif">'+v+'</text>';
    svg+='<text x="'+cx+'" y="'+(H-padB+15)+'" text-anchor="middle" font-size="10" fill="var(--slate)" font-family="Archivo,sans-serif">'+esc(abbr(q.name))+'</text>';
  });
  const bars=document.getElementById("bars");
  bars.setAttribute("viewBox","0 0 "+W+" "+H);
  bars.innerHTML=svg;
  const below=reqs.filter(q=>!q.filled&&q.slate.length<CONFIG.slateTarget).length;
  document.getElementById("barCap").textContent=
    below===0 ? "Every search is at full slate." : below+" of "+reqs.length+" searches sit below the target.";
  document.getElementById("barLegend").innerHTML=
    '<span><i class="key" style="background:var(--at-target)"></i>At target</span>'+
    '<span><i class="key" style="background:var(--blue)"></i>Below target</span>'+
    '<span><i class="key" style="background:var(--gray)"></i>No candidates yet</span>';

  document.getElementById("board").innerHTML=reqs.map(q=>{
    const cnt=q.slate.length;
    let slots="";
    for(let i=0;i<CONFIG.slateTarget;i++) slots+='<span class="slot'+(i<cnt?(q.filled?" won":" on"):"")+'"></span>';
    const open=q.filled?0:Math.max(0,CONFIG.slateTarget-cnt);
    const status=q.filled?'<span class="full">Offer out</span>'
      :(open?'<span class="short">'+open+' more to source</span>':'<span class="full">Full slate</span>');
    const rowHTML=q.live.map(({rec,stage})=>{
      const d=shortDate(rec["Submit Date"]);
      const bits=[d?"Submitted "+esc(d):"Not yet submitted"];
      const isContract=(rec["Role Type"]||"").trim().toLowerCase()==="contract";
      const bill=money(rec["Hourly Bill Rate"]), sal=money(rec["Salary"]);
      if(isContract && bill)      bits.push("Bill rate "+esc(bill));
      else if(sal)                bits.push("Salary "+esc(sal));
      const iv=shortDate(rec["Interview Date"]), st=shortDate(rec["Start Date"]);
      if(st)      bits.push("Starts "+esc(st));
      else if(iv) bits.push("Interview "+esc(iv));
      const age=daysSince(rec["Submit Date"]);
      if(age!==null){
        const grade = stage.clock
          ? (age>=7?" late":age>=5?" mid":age>=3?" warn":"") : "";
        bits.push('<span class="age'+grade+'">'+age+(age===1?" day":" days")+'</span>');
      }
      return '<div class="row '+stage.tone+'"><div class="row-main">'+
        '<div class="nm">'+esc(rec["First Name"]+" "+rec["Last Name"])+
          ((rec["Role Type"]||"").trim() && (rec["Role Type"]||"").trim().toLowerCase()!==(q.roleType||"").toLowerCase()
            ? ' <span class="qual">('+esc((rec["Role Type"]||"").trim())+')</span>' : "")+'</div>'+
        '<div class="meta">'+bits.join(" &middot; ")+'</div></div>'+
        '<span class="tag '+stage.tone+'">'+esc(stage.label)+'</span></div>';
    });
    const hidden=rowHTML.length-ROWS_SHOWN;
    const rows = hidden>0
      ? rowHTML.slice(0,ROWS_SHOWN).join("")+
        '<div class="extra" hidden>'+rowHTML.slice(ROWS_SHOWN).join("")+'</div>'+
        '<button class="moreBtn" type="button" data-n="'+hidden+'">Show '+hidden+' more</button>'
      : rowHTML.join("");
    return '<div class="col"><div class="col-head">'+
      '<div class="col-title"><h2>'+esc(q.name)+
        (q.roleType&&q.roleType.toLowerCase()!=="direct"?' <span class="qual">('+esc(q.roleType)+')</span>':"")+
        (q.live.length?' <span class="count">'+q.live.length+'</span>':"")+
        '</h2><span class="slots">'+slots+'</span></div>'+
      '<div class="col-sub"><span>'+(q.reportsTo?"Reports to "+esc(q.reportsTo):"&nbsp;")+'</span>'+status+'</div>'+
      '</div>'+
      (rows||'<div class="empty">No candidates submitted yet.</div>')+
      (open&&rows?'<div class="empty">Sourcing '+open+' more.</div>':'')+
      '</div>';
  }).join("");

  const boardEl=document.getElementById("board");
  if(!boardEl.dataset.moreBound){
    boardEl.dataset.moreBound="1";
    boardEl.addEventListener("click",e=>{
      const btn=e.target.closest(".moreBtn"); if(!btn)return;
      const extra=btn.previousElementSibling;
      const open=extra.hasAttribute("hidden");
      if(open) extra.removeAttribute("hidden"); else extra.setAttribute("hidden","");
      btn.textContent = open ? "Show less" : "Show "+btn.dataset.n+" more";
    });
  }
  document.getElementById("charts").hidden=false;
  document.getElementById("state").style.display="none";
}

async function load(){
  if(!ACTIVE.key){
    document.getElementById("state").innerHTML =
      "<b>No dashboard at this address</b>Check the link, or contact proHIRE Resources.";
    document.getElementById("clientMark").innerHTML="";
    return;
  }
  let recs=null, live=false;
  try{
    const res=await fetch(CONFIG.feedUrl+"&_="+Date.now(),{cache:"no-store"});
    if(res.ok){const p=toObjects(parseCSV(await res.text())); if(p.length){recs=p;live=true;}}
  }catch(e){}
  if(!recs)recs=toObjects(parseCSV(SNAPSHOT));
  if(!recs.length){
    document.getElementById("state").innerHTML="<b>No candidates in process</b>Nothing has been submitted against your open searches yet.";
    return;
  }
  const now=new Date().toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
  document.getElementById("dot").className="dot"+(live?"":" stale");
  document.getElementById("pulseTxt").textContent=live?"Live":"Not live \u00b7 "+SNAPSHOT_TAKEN;
  document.getElementById("stamp").textContent=live
    ? "Updated "+now+". Refreshes on its own."
    : "Could not reach the Google feed, so this is a frozen copy from "+SNAPSHOT_TAKEN+" and may not match the tracker.";
  render(recs);
}
load();
setInterval(load, CONFIG.refreshMs);
</script>
